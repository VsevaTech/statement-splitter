[project]
name = "statement-splitter"
version = "0.1.0"
description = "Turn messy bank statements into categorized expense reports — and teach the app your merchants as you go."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM"]
ignore = ["B008", "N818", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["app"]
