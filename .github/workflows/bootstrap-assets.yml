# One-time helper: (re)creates generated demo assets — the synthetic statements in
# demo-data/ (deterministic, see scripts/generate_demo_data.py) and the README
# screenshots. It only does anything when one of those files is missing from the repo.
name: Bootstrap generated assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check which assets are missing
        id: check
        run: |
          missing=0
          for f in demo-data/statement.csv demo-data/statement-2.csv demo-data/statement.xlsx \
                   docs/screenshot-review.png docs/screenshot-home.png; do
            [ -f "$f" ] || { echo "missing: $f"; missing=1; }
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.missing == '1'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.check.outputs.missing == '1'
        run: pip install -r requirements-dev.txt
      - name: Generate synthetic demo data
        if: steps.check.outputs.missing == '1'
        run: python scripts/generate_demo_data.py
      - name: Take README screenshots (best effort)
        if: steps.check.outputs.missing == '1'
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:///./data/bootstrap.db
        run: |
          {
            pip install playwright
            python -m playwright install --with-deps chromium
            nohup python -m uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
            for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
            python scripts/take_screenshots.py http://localhost:8000
            ls -la docs
          } > screenshots.log 2>&1 || echo "screenshot step failed" >> screenshots.log
          # Mirror the log into the run summary so failures are visible without log access.
          {
            echo '### Screenshot step'
            echo '```'
            tail -c 3000 screenshots.log
            echo '--- uvicorn ---'
            tail -c 1000 uvicorn.log 2>/dev/null || echo "(no uvicorn log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit assets
        if: steps.check.outputs.missing == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in demo-data/statement.csv demo-data/statement-2.csv demo-data/statement.xlsx \
                   docs/screenshot-review.png docs/screenshot-home.png; do
            [ -f "$f" ] || continue
            # Only add assets the repository does not have yet; never churn tracked ones.
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then continue; fi
            git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: add generated synthetic demo statements and README screenshots"
          git push
